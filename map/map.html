```html
<!DOCTYPE html>
<html>
<head>
    <title>Smart Campus Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Smart Campus Map</h1>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
        // Create the map
        const map = L.map('map').setView([12.869, 80.219], 18);

        // Add OpenStreetMap map tiles
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);
        L.marker([12.869, 80.219])
          .addTo(map)
          .bindPopup("<b>St Joseph's Institute of Technology</b>");
       fetch("campus-only.geojson")
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {
            onEachFeature: function (feature, layer) {
                if (feature.properties && feature.properties.name) {
                    layer.bindPopup(
                        "<b>" + feature.properties.name + "</b>"
                    );
                }
            }
        }).addTo(map);
    })
    .catch(error => {
        console.error("Error loading campus map:", error);
    });
    </script>

</body>
</html>
