<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* Header */

        .header {
            background: #123b63;
            color: white;
            padding: 18px 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Main container */

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 25px auto;
        }

        /* Map card */

        .map-card {
            background: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        #map {
            width: 100%;
            height: 650px;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Legend */

        .legend {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            line-height: 24px;
            font-size: 13px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .academic {
            background: #42a5f5;
        }

        .hostel {
            background: #66bb6a;
        }

        .mess {
            background: #ff9800;
        }

        .campus {
            background: #dceaf7;
            border: 2px solid #123b63;
        }

        .religious {
            background: #8e44ad;
            border-radius: 50%;
        }

        /* Religious markers */

        .religious-marker {
            width: 15px;
            height: 15px;
            background: #8e44ad;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        /* Building popup */

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            color: #123b63;
            margin-bottom: 5px;
        }

        .popup-type {
            font-size: 13px;
            color: #555;
        }

        .popup-info {
            margin-top: 7px;
            font-size: 13px;
            color: #333;
        }

        /* Footer */

        .footer {
            text-align: center;
            margin: 15px 0 25px;
            font-size: 13px;
            color: #6b7280;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .header h1 {
                font-size: 21px;
            }

            .container {
                width: 98%;
                margin: 12px auto;
            }

            #map {
                height: 550px;
            }

            .map-card {
                padding: 7px;
            }

        }

    </style>

</head>

<body>

    <!-- Header -->

    <header class="header">

        <h1>Smart Campus</h1>

        <p>
            Interactive Campus Map
        </p>

    </header>


    <!-- Main -->

    <main class="container">

        <div class="map-card">

            <div id="map"></div>

        </div>

    </main>


    <div class="footer">
        Smart Campus Visitor Management & Analytics System
    </div>


    <!-- Leaflet JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- Campus Data -->

    <script src="campus-data.js"></script>
<script>

    /* ============================================================
       MAP INITIALIZATION
    ============================================================ */

    const map = L.map("map", {
        zoomControl: true,
        attributionControl: true
    });


    /* ============================================================
       OPENSTREETMAP TILE LAYER
    ============================================================ */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    /* ============================================================
       DEFAULT MAP LOCATION
    ============================================================ */

    map.setView(
        [12.8695, 80.2165],
        17
    );


    /* ============================================================
       BUILDING STYLE
    ============================================================ */

    function getBuildingStyle(feature) {

        const properties = feature.properties || {};

        const name = properties.name || "";

        const building = properties.building || "";


        /* --------------------------------------------------------
           COLLEGE BOUNDARY
        -------------------------------------------------------- */

        if (
            name === "St Joseph's Institute of Technology" ||
            name === "St. Joseph's College of Engineering"
        ) {

            return {
                color: "#123b63",
                weight: 3,
                fillColor: "#dceaf7",
                fillOpacity: 0.08
            };

        }


        /* --------------------------------------------------------
           HOSTEL
        -------------------------------------------------------- */

        if (
            name.toLowerCase().includes("hostel") ||
            building === "dormitory"
        ) {

            return {
                color: "#2e7d32",
                weight: 2,
                fillColor: "#66bb6a",
                fillOpacity: 0.45
            };

        }


        /* --------------------------------------------------------
           MESS
        -------------------------------------------------------- */

        if (
            name.toLowerCase().includes("mess")
        ) {

            return {
                color: "#e65100",
                weight: 2,
                fillColor: "#ff9800",
                fillOpacity: 0.45
            };

        }


        /* --------------------------------------------------------
           NORMAL BUILDING
        -------------------------------------------------------- */

        return {
            color: "#1565c0",
            weight: 2,
            fillColor: "#42a5f5",
            fillOpacity: 0.35
        };

    }


    /* ============================================================
       STORE ALL BUILDING LAYERS
    ============================================================ */

    let allBuildingLayers = [];


    /* ============================================================
       RESET BUILDING STYLES
    ============================================================ */

    function resetBuildingStyles() {

        allBuildingLayers.forEach(function (item) {

            item.layer.isSelected = false;

            item.layer.setStyle(
                getBuildingStyle(item.feature)
            );

        });

    }


    /* ============================================================
       BUILDING POPUP + CLICK
    ============================================================ */

    function setupBuildingInteraction(feature, layer) {

        const properties =
            feature.properties || {};


        const name =
            properties.name || "Building";


        const building =
            properties.building || "Not specified";


        const amenity =
            properties.amenity || "";


        const startDate =
            properties.start_date || "";


        /* --------------------------------------------------------
           POPUP
        -------------------------------------------------------- */

        let popupHTML = `

            <div>

                <div class="popup-title">
                    ${name}
                </div>

        `;


        if (building) {

            popupHTML += `

                <div class="popup-type">
                    Building: ${building}
                </div>

            `;

        }


        if (amenity) {

            popupHTML += `

                <div class="popup-info">
                    Type: ${amenity}
                </div>

            `;

        }


        if (startDate) {

            popupHTML += `

                <div class="popup-info">
                    Date: ${startDate}
                </div>

            `;

        }


        popupHTML += `

            </div>

        `;


        /* --------------------------------------------------------
           BIND POPUP DIRECTLY TO ACTUAL OSM FOOTPRINT
        -------------------------------------------------------- */

        layer.bindPopup(popupHTML);


        /* --------------------------------------------------------
           CLICK
        -------------------------------------------------------- */

        layer.on("click", function () {

            resetBuildingStyles();

            layer.isSelected = true;

            layer.setStyle({

                weight: 4,
                fillOpacity: 0.65

            });

            layer.bringToFront();

        });


        /* --------------------------------------------------------
           MOUSE HOVER
        -------------------------------------------------------- */

        layer.on("mouseover", function () {

            if (!layer.isSelected) {

                layer.setStyle({

                    weight: 3,
                    fillOpacity: 0.5

                });

            }

        });


        layer.on("mouseout", function () {

            if (!layer.isSelected) {

                layer.setStyle(
                    getBuildingStyle(feature)
                );

            }

        });


        /* --------------------------------------------------------
           POPUP CLOSE
        -------------------------------------------------------- */

        layer.on("popupclose", function () {

            layer.isSelected = false;

            layer.setStyle(
                getBuildingStyle(feature)
            );

        });

    }


    /* ============================================================
       LOAD OSM GEOJSON
    ============================================================ */

    fetch("campus-only.geojson")

        .then(function (response) {

            if (!response.ok) {

                throw new Error(
                    "GeoJSON file could not be loaded."
                );

            }

            return response.json();

        })


        .then(function (data) {


            /* ====================================================
               CREATE CAMPUS BOUNDARY LAYER
            ==================================================== */

            const boundaryLayer = L.geoJSON(
                data,
                {

                    filter: function (feature) {

                        const name =
                            feature.properties?.name || "";

                        return (
                            name ===
                            "St Joseph's Institute of Technology" ||

                            name ===
                            "St. Joseph's College of Engineering"
                        );

                    },


                    style: getBuildingStyle,


                    /*
                       IMPORTANT:
                       Boundary is NOT interactive.
                       Therefore it will NOT block building clicks.
                    */

                    interactive: false

                }

            ).addTo(map);


            /* ====================================================
               CREATE ACTUAL BUILDING LAYER
            ==================================================== */

            const buildingLayer = L.geoJSON(
                data,
                {

                    filter: function (feature) {

                        const properties =
                            feature.properties || {};

                        const name =
                            properties.name || "";

                        const building =
                            properties.building || "";

                        const amenity =
                            properties.amenity || "";


                        /*
                           Don't duplicate college boundaries
                        */

                        if (
                            name ===
                            "St Joseph's Institute of Technology" ||

                            name ===
                            "St. Joseph's College of Engineering"
                        ) {

                            return false;

                        }


                        /*
                           Keep actual buildings and
                           meaningful named campus features
                        */

                        return (
                            building !== "" ||
                            name !== "" ||
                            amenity !== ""
                        );

                    },


                    style: getBuildingStyle,


                    /* ------------------------------------------------
                       MAKE ACTUAL OSM FOOTPRINT CLICKABLE
                    ------------------------------------------------ */

                    onEachFeature: function (
                        feature,
                        layer
                    ) {

                        allBuildingLayers.push({

                            feature: feature,

                            layer: layer

                        });


                        setupBuildingInteraction(
                            feature,
                            layer
                        );

                    }

                }

            ).addTo(map);


            /* ====================================================
               FIT MAP TO CAMPUS
            ==================================================== */

            const bounds =
                boundaryLayer.getBounds();


            if (bounds.isValid()) {

                map.fitBounds(
                    bounds,
                    {
                        padding: [
                            30,
                            30
                        ]
                    }
                );

            }

        })


        .catch(function (error) {

            console.error(
                "Error loading campus GeoJSON:",
                error
            );

            alert(
                "Unable to load the campus map data."
            );

        });


    /* ============================================================
       RELIGIOUS MARKER
    ============================================================ */

    function createReligiousMarker() {

        return L.divIcon({

            className: "",

            html:
                '<div class="religious-marker"></div>',

            iconSize: [
                15,
                15
            ],

            iconAnchor: [
                7,
                7
            ],

            popupAnchor: [
                0,
                -7
            ]

        });

    }


    /* ============================================================
       MANUAL CAMPUS DATA
    ============================================================ */

    if (
        typeof campusData !==
        "undefined"
    ) {

        campusData.forEach(
            function (area) {

                if (!area.locations) {
                    return;
                }


                area.locations.forEach(
                    function (location) {


                        let popupContent = `

                            <div>

                                <div class="popup-title">
                                    ${area.name}
                                </div>

                                <div class="popup-type">
                                    ${location.name}
                                </div>

                        `;


                        if (
                            location.description
                        ) {

                            popupContent += `

                                <div class="popup-info">
                                    ${location.description}
                                </div>

                            `;

                        }


                        popupContent += `

                            </div>

                        `;


                        const marker =
                            L.marker(
                                [
                                    location.latitude,
                                    location.longitude
                                ],
                                {
                                    icon:
                                        createReligiousMarker()
                                }
                            )
                            .addTo(map);


                        marker.bindPopup(
                            popupContent
                        );

                    }
                );

            }
        );

    }


    /* ============================================================
       LEGEND
    ============================================================ */

    const legend =
        L.control({
            position: "bottomright"
        });


    legend.onAdd =
        function () {

            const div =
                L.DomUtil.create(
                    "div",
                    "legend"
                );


            div.innerHTML = `

                <div class="legend-title">
                    Map Legend
                </div>


                <div class="legend-item">

                    <span
                        class="legend-box academic">
                    </span>

                    Academic Building

                </div>


                <div class="legend-item">

                    <span
                        class="legend-box hostel">
                    </span>

                    Hostel

                </div>


                <div class="legend-item">

                    <span
                        class="legend-box mess">
                    </span>

                    Mess

                </div>


                <div class="legend-item">

                    <span
                        class="legend-box campus">
                    </span>

                    Campus Boundary

                </div>


                <div class="legend-item">

                    <span
                        class="legend-box religious">
                    </span>

                    Religious Place

                </div>

            `;


            return div;

        };


    legend.addTo(map);

</script>

    

</body>

</html>
