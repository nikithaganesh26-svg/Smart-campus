       fetch("campus-only.geojson")
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {
           style: function (feature) {
    if (
        feature.properties &&
        (
            feature.properties.name === "St Joseph's Institute of Technology" ||
            feature.properties.name === "St. Joseph's College of Engineering"
        )
    ) {
        return {
            color: "red",
            weight: 3,
            fillOpacity: 0.05
        };
    }

    return {
        color: "blue",
        weight: 2,
        fillOpacity: 0.4
    };
},
            onEachFeature: function (feature, layer) {
                if (feature.properties && feature.properties.name) {

                    let popupContent =
                        "<b>" + feature.properties.name + "</b>";

                    if (feature.properties.amenity) {
                        popupContent +=
                            "<br>Type: " + feature.properties.amenity;
                    }

                    if (feature.properties.start_date) {
                        popupContent +=
                            "<br>Established: " + feature.properties.start_date;
                    }

                    layer.bindPopup(popupContent);
                }
            }
        }).addTo(map).bringToFront();

    })
    .catch(error => {
        console.error("Error loading campus map:", error);
    });   

    </script>
